[package]
name = "hagoromo"
license = "MIT"
description = "Declarative vector graphics DSL inspired by the Haskell diagrams package."
version = "0.4.0"
edition = "2021"

[features]
serde = ["dep:serde", "kurbo/serde"]
gluon-scripting = ["dep:gluon", "dep:gluon_codegen", "dep:gluon_vm"]

[dependencies]
kurbo = "0.11"
serde = { version = "1", features = ["derive"], optional = true }
gluon = { version = "=0.18.2", optional = true }
gluon_vm = { version = "=0.18.2", optional = true }
gluon_codegen = { version = "=0.18.2", optional = true }

[dev-dependencies]
approx = "0.5"

[[example]]
name = "run_gluon"
required-features = ["gluon-scripting"]

[[test]]
name = "gluon_integration"
required-features = ["gluon-scripting"]
